[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-backend"
version = "0.1.0"
description = "FastAPI backend for the hackathon project"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "cryptography>=42",
    "fastapi>=0.115",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "tzdata",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
